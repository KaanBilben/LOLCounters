[package]
name = "lolcounters"
version = "0.1.2"
description = "LoL counter öneri uygulaması"
authors = ["KaanBilben"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix is necessary to make the lib name unique and not conflict with the bin name.
# See https://github.com/rust-lang/cargo/issues/8519
name = "lolcounters_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
futures = "0.3"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
# LC-008: LoL istemcisi (LCU) bağlantısı; yalnızca src/lcu.rs kullanır.
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
winreg = "0.56"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
